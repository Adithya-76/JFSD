services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: "${POSTGRES_DB:-lexiscan}"
      POSTGRES_USER: "${POSTGRES_USER:-lexiscan}"
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}"
    volumes: ["postgres-data:/var/lib/postgresql/data"]
    healthcheck: { test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"], interval: 5s, timeout: 3s, retries: 20 }
  backend:
    build: ./backend
    environment:
      POSTGRES_DB: "${POSTGRES_DB:-lexiscan}"
      POSTGRES_USER: "${POSTGRES_USER:-lexiscan}"
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}"
      JWT_SECRET: "${JWT_SECRET:?Set JWT_SECRET in .env}"
      ADMIN_EMAIL: "${ADMIN_EMAIL:-}"
      ADMIN_PASSWORD: "${ADMIN_PASSWORD:-}"
      CORS_ALLOWED_ORIGINS: "${CORS_ALLOWED_ORIGINS:-http://localhost:5173}"
    ports: ["8081:8080"]
    depends_on: { postgres: { condition: service_healthy } }
    healthcheck: { test: ["CMD", "wget", "-qO-", "http://localhost:8080/actuator/health"], interval: 10s, timeout: 4s, retries: 12 }
  frontend:
    build:
      context: ./frontend
      args: { VITE_API_URL: http://localhost:8081 }
    ports: ["5173:80"]
    depends_on: { backend: { condition: service_healthy } }
volumes: { postgres-data: {} }
