spring:
  application:
    name: lexiscan
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/lexiscan}
    username: ${DATABASE_USER:lexiscan}
    password: ${DATABASE_PASSWORD:lexiscan}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB
  flyway:
    enabled: true
  task:
    execution:
      pool:
        core-size: 2
        max-size: 4
        queue-capacity: 50
app:
  jwt:
    secret: "${JWT_SECRET}"
    expiration-minutes: ${JWT_EXPIRATION_MINUTES:120}
  storage-dir: ${STORAGE_DIR:./uploads}
  nlp:
    mode: ${NLP_MODE:java}
    remote-url: ${NLP_REMOTE_URL:http://nlp-service:8000}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173}
  admin:
    email: ${ADMIN_EMAIL:}
    password: ${ADMIN_PASSWORD:}
management:
  endpoints:
    web:
      exposure:
        include: "health,info"
springdoc:
  swagger-ui:
    path: /swagger-ui.html
